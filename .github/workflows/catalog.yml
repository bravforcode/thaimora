name: Authorized catalog sync
on:
  workflow_dispatch:
    inputs:
      catalog_path:
        description: Committed client-authorized catalog JSON path (never private coordinates)
        type: string
        required: true
permissions: {contents: read}
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CATALOG_RIGHTS_CONFIRMED: ${{ vars.CATALOG_RIGHTS_CONFIRMED }}
      CATALOG_PATH: ${{ inputs.catalog_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: test -f "$CATALOG_PATH" && npx tsx scripts/sync-hotel-catalog.ts "$CATALOG_PATH"
