name: Manual content sync
on:
  workflow_dispatch:
    inputs:
      source:
        description: Process all enabled due registry sources (maximum two per call)
        type: choice
        options: [all]
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: content-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Check shared free Actions reserve
        run: node --import tsx scripts/check-actions-budget.ts
        env:
          GITHUB_BUDGET_TOKEN: ${{ secrets.GITHUB_BUDGET_TOKEN }}
          GITHUB_BUDGET_REPOSITORIES: ${{ vars.GITHUB_BUDGET_REPOSITORIES }}
      - name: Invoke private worker for enabled due sources
        run: node --import tsx scripts/sync-content.ts all
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CONTENT_SYNC_SECRET: ${{ secrets.CONTENT_SYNC_SECRET }}
