name: Encrypted logical backup
on:
  schedule: [{cron: '47 4 * * *'}]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: logical-backup, cancel-in-progress: false}
jobs:
  backup:
    if: vars.AUTOMATION_ENABLED == 'true' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      AGE_IDENTITY_FILE: ${{ runner.temp }}/backup-age-identity
      PG_BACKUP_IMAGE: ${{ vars.PG_BACKUP_IMAGE }}
      GITHUB_BUDGET_TOKEN: ${{ secrets.GITHUB_BUDGET_TOKEN }}
      GITHUB_BUDGET_REPOSITORIES: ${{ vars.GITHUB_BUDGET_REPOSITORIES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - name: Verify shared account Actions reserve
        run: npx tsx scripts/check-actions-budget.ts
      - name: Require reviewed immutable PostgreSQL image
        run: '[[ "$PG_BACKUP_IMAGE" =~ ^postgis/postgis:17-3\.5@sha256:[a-f0-9]{64}$ ]]'
      - name: Install encryption tooling
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Verify compatible PostgreSQL17 encrypted recovery
        shell: bash
        env:
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$AGE_IDENTITY"
          printf '%s\n' "$AGE_IDENTITY" > "$AGE_IDENTITY_FILE"
          trap 'rm -f "$AGE_IDENTITY_FILE"' EXIT
          bash scripts/backup-db.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-db-${{ github.run_id }}
          path: scripts/output/backups/*.dump.age
          retention-days: 7
          if-no-files-found: error
