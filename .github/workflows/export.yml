name: Snapshot and optional rebuild
on:
  workflow_run:
    workflows: [Content sync, Authorized catalog sync]
    types: [completed]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: snapshot, cancel-in-progress: false}
jobs:
  snapshot:
    if: vars.AUTOMATION_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EXPORT_MODE: production
      HOSTING_PROVIDER: ${{ vars.HOSTING_PROVIDER }}
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
      GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_DEPLOY_TOKEN }}
      GITHUB_DEPLOY_REF: ${{ vars.GITHUB_DEPLOY_REF }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAMES: thaimora,taotide
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_BUDGET_TOKEN: ${{ secrets.GITHUB_BUDGET_TOKEN }}
      GITHUB_BUDGET_REPOSITORIES: ${{ vars.GITHUB_BUDGET_REPOSITORIES }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx tsx scripts/check-actions-budget.ts
      - run: npx tsx scripts/export-public-content.ts
      - name: Request rebuild only when public data changed and actual shared budget permits
        run: npx tsx scripts/request-rebuild.ts
